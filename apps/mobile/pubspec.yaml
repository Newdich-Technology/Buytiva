name: buytiva_mobile
description: BUYTIVA mobile application by Oluwayemi Oyinlola.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  lordicon: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/BUYTIVA_ERROR_CATALOG.json
    - assets/illustrations/errors/
    - assets/brand/
    - assets/animations/lordicon/
