<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Local knowledge in motion</title>
  <desc id="desc">A procurer carries a market basket beside a verified application path.</desc>
