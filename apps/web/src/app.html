<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#F2E8D8" />
		<script>
			try {
				const savedTheme = localStorage.getItem('buytiva-theme');
				const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : systemTheme;
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
			const dark = document.documentElement.dataset.theme === 'dark';
			const themeColor = location.pathname === '/' ? (dark ? '#172721' : '#F2E8D8') : (dark ? '#101827' : '#FBF8F1');
			document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor);
			document.documentElement.classList.add('js-enabled');
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
